# WaveLink 统一开发工作区（virtual manifest）
#
# 各端都通过 path 依赖直接引用本地 core（音频引擎），
# 不依赖 git tag / 远端仓库。

[workspace]
members = [
    "core",
    "mobile/rust",
]
# core/vendor/oboe 经 core 的 path 依赖自动成为本 workspace 隐式成员（cargo 默认行为，
# 有意保留）：作为成员才能继承下方 [profile] 优化配置；勿用 exclude 移除。
resolver = "2"

# Flutter debug（flutter run）走 cargo dev profile，默认 O0 + overflow-checks，
# 音频 DSP（解码/重采样/PEQ/FFT）跑不过 48kHz 实时消费 → ringbuf underrun 爆音
# （release O3 正常）。dev 提优化对齐音频性能，debug-assertions 仍保留。
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

# release（各端上架包）：strip 去符号表（.so 8.7M → ~5.5M），
# lto + 单编译单元进一步压缩 10~20% 并提升运行性能。
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# core 的 symphonia 用 git main；adapter 仍依赖 crates.io 的 symphonia-core，
# 用 patch 统一到同一版本源码，避免双 symphonia_core 编译冲突
[patch.crates-io]
symphonia-core = { git = "https://github.com/pdeljanov/Symphonia", branch = "main" }
