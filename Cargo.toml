[package]
name = "audio-core"
version = "0.1.0"
edition = "2021"
description = "纯 Rust 音频引擎：解码 + DSP 管线"

[features]
default = ["cpal-backend"]
cpal-backend = ["cpal"]
ffi = []
oboe-backend = ["oboe"]
audiounit-backend = ["coreaudio-sys"]
wasapi-backend = []

[dependencies]
cpal = { version = "0.15", optional = true }
oboe = { version = "0.6", features = ["java-interface"], optional = true }
coreaudio-sys = { version = "0.2", optional = true }
crossbeam-channel = "0.5"
ringbuf = "0.4"
fastrand = "2"
fft-convolver = "0.4"
hound = "3.5"
tracing = "0.1"
# 实时安全互斥锁（无内核调用，适配音频回调线程）
parking_lot = "0.12"

# 分析模块（BPM / Key）
realfft = "3"

# 序列化（引擎事件）
serde = { version = "1", features = ["derive"] }

# 元数据标签读取（lofty 替代 Symphonia 的 minimal 标签解析）
lofty = "0.24"

# 纯 Rust 解码器
symphonia = { version = "0.6", default-features = false, features = [
    "mp3", "flac", "pcm", "vorbis", "aac", "alac", "isomp4", "ogg", "wav", "aiff"
] }
symphonia-adapter-oporus = "0.1"
rubato = "0.10"
dsd-reader = "0.3"

# 视频容器封面提取（MKV/WebM）
matroska = "0.30"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Devices_Properties"
] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
crate-type = ["staticlib", "lib"]
