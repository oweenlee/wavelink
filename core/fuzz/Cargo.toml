[package]
name = "audio-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# cargo-fuzz 要求 fuzz crate 独立于上层 workspace；
# monorepo 下不声明会触发 "believes it's in a workspace when it's not" 错误
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# feature 列表与 core 保持一致（含 alac），确保 fuzz 覆盖的解码路径与线上一致
symphonia = { version = "0.6.1", default-features = false, features = [
    "mp3", "flac", "pcm", "vorbis", "aac", "alac", "isomp4", "ogg", "wav", "aiff"
] }

# 曾用 [patch.crates-io] 指向 symphonia git main；core 已迁回 crates.io 0.6.1
# （根 workspace 亦已移除 patch），此处保留 patch 会编出第二份、与主工程不同源的
# symphonia-core。故删除：fuzz 与主工程共用 crates.io 同一版本。

[dependencies.audio-core]
path = ".."

[[bin]]
name = "symphonia"
path = "fuzz_targets/symphonia.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dsp"
path = "fuzz_targets/dsp.rs"
test = false
doc = false
bench = false
