[package]
name = "audio-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# cargo-fuzz 要求 fuzz crate 独立于上层 workspace；
# monorepo 下不声明会触发 "believes it's in a workspace when it's not" 错误
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
symphonia = { version = "0.6", default-features = false, features = [
    "mp3", "flac", "pcm", "vorbis", "aac", "isomp4", "ogg", "wav", "aiff"
] }

# 独立 workspace 不继承根 Cargo.toml 的 patch；
# 不重复声明会触发双 symphonia_core 编译冲突（与根工作区同理）
[patch.crates-io]
symphonia-core = { git = "https://github.com/pdeljanov/Symphonia", branch = "main" }

[dependencies.audio-core]
path = ".."

[[bin]]
name = "symphonia"
path = "fuzz_targets/symphonia.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dsp"
path = "fuzz_targets/dsp.rs"
test = false
doc = false
bench = false
