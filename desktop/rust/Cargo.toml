[package]
name = "wavelink_desktop"
version = "0.1.0"
edition = "2021"
description = "WaveLink 桌面端 Rust FFI 桥接层（Flutter Rust Bridge，与 mobile 绑定层统一）"

[lib]
name = "wavelink_desktop"
# 仅 cdylib：桌面端经 RustLib.init(externalLibrary:) 动态加载。
# desktop 走「外部库加载」模型（不静态链接进 app），不需要 staticlib/lib；
# 多 crate-type 会在 macOS 上生成 deps/libwavelink_desktop.dylib 并被顶层
# cdylib 以绝对路径依赖，打包后脆弱。改单一 cdylib 产出自包含动态库。
crate-type = ["cdylib"]

[dependencies]
# 路径依赖共享音频核心（继承 hi-res / DSP / bit-perfect）
audio-core = { path = "../../core" }
# 设备枚举（桌面特有）：直接读 cpal 输出设备列表
cpal = "0.15"
crossbeam-channel = "0.5"
serde_json = "1"
# Flutter Rust Bridge（与 mobile 同版本 2.13.0-beta.5），统一绑定层
flutter_rust_bridge = "=2.13.0-beta.5"
# —— 网络音源（与 mobile 对齐）——
# SMB 直挂：纯 Rust SMB2/3 客户端（支持 guest 匿名访问）
smb2 = "0.17"
# 封面提取兜底（与 core 同版本）：lofty 遍历全部标签图片取内嵌封面
lofty = "0.24"
# CUE 文本 GBK 回退解码（中文/日文抓轨的 cue 常非 UTF-8；core 的
# parse_cue 按 UTF-8 读行，非法字节直接失败，故在桥接层先解码）
encoding_rs = "0.8"
# WebDAV 边下边播：HTTP 客户端（Digest/Basic 认证 + 流式读取）
# default-features=false + rustls-tls：不依赖系统 OpenSSL，跨 mac/win/linux 编译
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Digest 认证计算（MD5 HA1/HA2/response）+ hex 输出 + Basic base64
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "fs"] }

[lints.rust]
# FRB 宏会注入 cfg(frb_expand) 条件，需在清单中声明以免 unexpected_cfgs 告警
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[dev-dependencies]
# 冒烟测试用：生成正弦 WAV 驱动真实输出
hound = "3"
