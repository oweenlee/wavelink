[package]
name = "sdk"
version = "0.1.0"
edition = "2021"
description = "音乐播放器 SDK：曲库管理 + audio-core 封装"

[dependencies]
audio-core = { path = "../../../../core" }
serde = { version = "1", features = ["derive"] }

# 曲库
rusqlite = { version = "0.34", features = ["bundled"] }
lofty = "0.24"
base64 = "0.22"
encoding_rs = "0.8"
tracing = "0.1"

# 图片处理（封面缩略图）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
crossbeam-channel = "0.5"
hound = "3.5"
