<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="512" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="40%" stop-color="#6d28d9"/>
      <stop offset="60%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="512" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="40%" stop-color="#0f766e"/>
      <stop offset="60%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Light background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#d8d0f0" stroke-width="3"/>

  <!-- Subtle shadow under ribbons -->
  <path d="M40 144 C160 112, 160 376, 256 376 C352 376, 352 112, 472 144"
        fill="none" stroke="#00000022" stroke-width="96" stroke-linecap="round"/>
  <path d="M40 368 C160 400, 160 136, 256 136 C352 136, 352 400, 472 368"
        fill="none" stroke="#00000022" stroke-width="92" stroke-linecap="round"/>

  <!-- Wave 1 (purple) -->
  <path d="M40 144 C160 112, 160 376, 256 376 C352 376, 352 112, 472 144"
        fill="none" stroke="url(#w1)" stroke-width="96" stroke-linecap="round"/>

  <!-- Wave 2 (teal) -->
  <path d="M40 368 C160 400, 160 136, 256 136 C352 136, 352 400, 472 368"
        fill="none" stroke="url(#w2)" stroke-width="92" stroke-linecap="round"/>

  <!-- Link nodes -->
  <circle cx="160" cy="256" r="24" fill="#6d28d9"/>
  <circle cx="352" cy="256" r="24" fill="#0f766e"/>
  <circle cx="160" cy="256" r="10" fill="white" opacity="0.5"/>
  <circle cx="352" cy="256" r="10" fill="white" opacity="0.5"/>
</svg>
