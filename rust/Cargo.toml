[package]
name = "rust_lib_wavelink_mobile"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.13.0-beta.5"
audio-core = { path = "../../wavelink-audio-core", default-features = false }
crossbeam-channel = "0.5"
ringbuf = "0.4"
once_cell = "1"
arc-swap = "1"
realfft = "3.5"
lofty = "0.24"
parking_lot = "0.12"

[dev-dependencies]
# 仅测试用：生成正弦 WAV 以驱动 iOS 音频通路集成测试
hound = "3"
