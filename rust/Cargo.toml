[package]
name = "rust_lib_wavelink_mobile"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.13.0-beta.5"
audio-core = { git = "ssh://git@github.com/qinlaoban/wavelink-core.git", tag = "v0.1.0", default-features = false }
crossbeam-channel = "0.5"
ringbuf = "0.4"
once_cell = "1"
realfft = "3.5"
