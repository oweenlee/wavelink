[package]
name = "rust_lib_wavelink_mobile"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[lints.rust]
# FRB 宏会注入 cfg(frb_expand) 条件，需在清单中声明以免 unexpected_cfgs 告警
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[dependencies]
flutter_rust_bridge = "=2.13.0-beta.5"
jni = "0.21"
crossbeam-channel = "0.5"
ringbuf = "0.4"
once_cell = "1"
arc-swap = "1"
realfft = "3.5"
lofty = "0.24"
parking_lot = "0.12"
# SMB 直挂：纯 Rust SMB2/3 客户端（替换 smb_connect，支持 guest 匿名访问）
smb2 = "0.17"
# WebDAV 边下边播：HTTP 客户端（Digest/Basic 认证 + 流式读取）
# default-features=false + rustls-tls：跨 iOS/macOS/Android 编译，不依赖系统 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Digest 认证计算（MD5 HA1/HA2/response）+ hex 输出 + Basic base64
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "fs"] }

# Android: 启用 Oboe 后端（Rust 引擎直驱 AAudio，替代 Kotlin 泵线程 + AudioTrack + Headless）
# 注意: oboe crate 仅支持 Android，故必须在 target 级声明依赖，
# 否则 iOS/macOS 编译会在音频引擎依赖图上引入 oboe 而失败。
[target.'cfg(target_os = "android")'.dependencies]
audio-core = { path = "../../core", default-features = false, features = ["oboe-backend"] }

# 其他平台（iOS/macOS/desktop）保持无 oboe 的默认特性
[target.'cfg(not(target_os = "android"))'.dependencies]
audio-core = { path = "../../core", default-features = false }

[dev-dependencies]
# 仅测试用：生成正弦 WAV 以驱动 iOS 音频通路集成测试
hound = "3"
