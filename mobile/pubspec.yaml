name: wavelink_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

# 启动图：近黑底 + 白色 wordmark（黑白单色，与 app 调性一致）
flutter_native_splash:
  color: "#0A0A0A"
  image: "assets/splash/wordmark.png"
  android_12:
    color: "#0A0A0A"
    image: "assets/splash/wordmark.png"
  ios: true
  android: true
  web: false

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_riverpod: 3.4.2
  rust_lib_wavelink_mobile:
    path: rust_builder
  flutter_rust_bridge: 2.13.0-beta.5
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  go_router: ^14.0.0
  http: ^1.2.0
  webdav_client: ^1.2.2
  lucide_icons_flutter: ^3.1.15
  flutter_animate: ^4.5.2
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  checks: any
  flutter_native_splash: ^2.4.5

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located in the root of your
  # package. See that information about deactivating specific lint rules and
  # activating new ones.
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# For information on the Flutter-specific part of this file, see the
# following page: https://flutter.dev/to/pubspec

# The following section is specific to Flutter packages.
flutter:
  # 官方国际化方案：gen-l10n 从 lib/l10n 下的 .arb 生成 AppLocalizations
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use them in the
  # material Icons class.
  uses-material-design: true

  assets:
    - assets/splash/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
