name: Publish Windows (MSI + MSIX)

on:
  workflow_dispatch:
    inputs:
      sign_msix:
        description: "为 MSIX 签名（需配置 PFX 证书 Secrets）"
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "wavelink-engine"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (MSI)
        run: npm run tauri build -- --bundles msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PASSPHRASE: ${{ secrets.TAURI_SIGNING_PASSPHRASE || '' }}

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavelink-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Init tauri-windows-bundle
        run: npx @choochmeque/tauri-windows-bundle@latest init

      - name: Configure MSIX bundle
        shell: pwsh
        run: |
          $config = @'
          {
            "publisher": "CN=${{ secrets.MSIX_PUBLISHER || 'WaveLink' }}",
            "publisherDisplayName": "${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME || 'WaveLink Dev' }}",
            "capabilities": {
              "general": ["internetClient"]
            },
            "signing": {
              "pfx": null,
              "pfxPassword": null
            },
            "resourceIndex": {
              "enabled": false,
              "keepConfig": false
            }
          }
          '@
          $config | Out-File -FilePath src-tauri/gen/windows/bundle.config.json -Encoding utf8

      - name: Build MSIX
        run: npx @choochmeque/tauri-windows-bundle@latest build --runner npm
        env:
          MSIX_SIGN_PFX: ${{ secrets.MSIX_PFX_BASE64 || '' }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD || '' }}

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavelink-msix
          path: |
            *.msix
            *.msixbundle
            src-tauri/target/msix/*.msix
          if-no-files-found: warn

      - name: 创建 Release 并上传
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/msix/*.msix \
            --clobber
      
