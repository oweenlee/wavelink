# core（audio-core）CI。
#
# 注意：GitHub Actions 只读取仓库根的 .github/workflows/，
# 原 core/.github/workflows/ci.yml 在本 monorepo 中不会触发，已迁移至此。
# cargo 命令统一加 --manifest-path core/Cargo.toml，自动定位根 workspace
# （共享根 Cargo.lock 与 symphonia-core patch）。

name: Core CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Cargo check
        run: cargo check -p audio-core --manifest-path core/Cargo.toml

      - name: Cargo test
        run: cargo test -p audio-core --manifest-path core/Cargo.toml

  # 无后端（headless）构建：验证 core 在无 cpal/coreaudio-sys 等任何音频后端时
  # 仍能独立编译与链接。曾出现 macOS 上 raw CoreAudio FFI 未声明框架链接、
  # 依赖 cpal 顺带链接才不报错的隐性 bug（--no-default-features 必现 undefined symbols），
  # 默认 feature 的 CI 抓不到，故单独设此作业。
  #
  # 只测 --lib：链接 lib test 可执行文件即足以捕获上述 undefined symbols；
  # 集成测试（tests/）里的自动切歌用例依赖真实输出设备消费 ringbuf，
  # headless 下无回调拉取会必然超时，不属于 headless 场景。
  headless:
    name: Headless (no backend)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test lib with --no-default-features
        run: cargo test -p audio-core --no-default-features --lib --manifest-path core/Cargo.toml

  platform:
    name: Platform backends
    strategy:
      matrix:
        include:
          - os: macos-latest
            features: audiounit-backend
          - os: windows-latest
            features: wasapi-backend
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p audio-core --features "${{ matrix.features }}" --manifest-path core/Cargo.toml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Clippy
        run: cargo clippy -p audio-core --manifest-path core/Cargo.toml -- -D warnings

  fuzz:
    name: Fuzz (30s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz DSP pipeline
        run: cargo fuzz run dsp --manifest-path core/fuzz/Cargo.toml -- -max_total_time=30

      - name: Fuzz Symphonia probe
        run: cargo fuzz run symphonia --manifest-path core/fuzz/Cargo.toml -- -max_total_time=30
