name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 需要的 Secret（在 GitHub repo Settings → Secrets and variables → Actions 里设置）:
# - ENGINE_PAT: 访问私有 wavelink-engine 仓库的 Fine-grained PAT

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: 配置 git 访问私有引擎仓库
        run: |
          git config --global url."https://x-access-token:${{ secrets.ENGINE_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: 移除本地 .cargo/config（如果有，避免干扰 CI）
        run: rm -f .cargo/config.toml

      - name: Build Tauri app (macOS)
        run: npm run tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: wavelink-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
