name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 需要的 Secret（在 GitHub repo Settings → Secrets and variables → Actions 里设置）:
# - ENGINE_PAT: 访问私有 wavelink-engine 仓库的 PAT

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 配置 git 访问私有引擎仓库
        run: |
          git config --global url."https://x-access-token:${{ secrets.ENGINE_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: 移除本地 .cargo/config
        run: rm -f .cargo/config.toml

      - name: Build Tauri app
        run: npm run tauri build

      - name: 上传安装包 (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: wavelink-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 上传安装包 (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: wavelink-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
