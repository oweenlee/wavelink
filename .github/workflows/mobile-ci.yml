name: Mobile CI

on:
  push:
    branches: [main, master]
  pull_request:

# 移动端 CI：纯 Dart 的静态分析 + 单元/组件测试（无需真机或模拟器）。
#
# Rust native 库不在此构建：纯 Dart 测试中 RustLib.init 会失败并降级
# （rustAvailable=false），不影响单测运行。Rust 侧（mobile/rust）的数据通路
# 测试由 core 的 CI 与本地 `cargo test --manifest-path mobile/rust/Cargo.toml` 覆盖。
#
# 注意：integration_test/ 需真机/模拟器，不在本作业运行。

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit/widget tests
        run: flutter test
