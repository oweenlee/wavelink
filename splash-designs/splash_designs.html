<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WaveLink 启动页方案预览</title>
<style>
  :root {
    --bg: #0A0A0A;
    --fg: #F5F5F5;
    --muted: #8A8A8A;
    --line: rgba(245, 245, 245, 0.14);
    --ring: rgba(245, 245, 245, 0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "PingFang SC",
      "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: #000;
    color: var(--fg);
    overflow: hidden;
    height: 100vh;
  }

  /* ===== 顶部切换器 ===== */
  .tabs {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; gap: 6px; padding: 12px 14px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .tab {
    flex: 1; text-align: center; padding: 8px 4px;
    font-size: 12px; letter-spacing: 0.5px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 10px;
    cursor: pointer; user-select: none; transition: all .18s ease;
  }
  .tab b { display: block; font-size: 13px; font-weight: 600; color: inherit; margin-bottom: 2px; }
  .tab.active { color: var(--fg); border-color: rgba(245,245,245,.5); background: rgba(245,245,245,.06); }

  /* ===== 舞台 ===== */
  .stage { position: absolute; inset: 0; }
  .screen {
    position: absolute; inset: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding-top: 56px;
  }
  .screen.active { display: flex; }

  .wordmark {
    font-size: clamp(34px, 9vw, 52px);
    font-weight: 500; letter-spacing: 3px;
    color: var(--fg);
  }
  .hint {
    margin-top: 22px; font-size: 11px; letter-spacing: 4px;
    color: var(--muted); text-transform: uppercase;
  }

  /* ===== A. Pulse 声波脉冲 ===== */
  .wave { display: flex; align-items: flex-end; gap: 7px; height: 34px; margin-top: 26px; }
  .wave span {
    width: 3px; height: 10px; border-radius: 2px; background: var(--fg);
    animation: pulse 1.15s ease-in-out infinite;
  }
  .wave span:nth-child(1) { animation-delay: 0s; }
  .wave span:nth-child(2) { animation-delay: .15s; }
  .wave span:nth-child(3) { animation-delay: .3s; }
  .wave span:nth-child(4) { animation-delay: .45s; }
  .wave span:nth-child(5) { animation-delay: .6s; }
  @keyframes pulse { 0%,100% { height: 8px; opacity: .4; } 50% { height: 32px; opacity: 1; } }

  /* ===== B. Orbit 轨道圆环 ===== */
  .orbit-wrap { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid var(--ring);
  }
  .ring.spin {
    border-color: transparent;
    border-top-color: rgba(245,245,245,.85);
    border-right-color: rgba(245,245,245,.3);
    animation: spin 2.4s linear infinite;
  }
  .ring.inner { inset: 26px; border-color: rgba(245,245,245,.08); }
  .orbit-dot {
    position: absolute; top: -3px; left: 50%; width: 6px; height: 6px; margin-left: -3px;
    border-radius: 50%; background: var(--fg);
    box-shadow: 0 0 12px rgba(245,245,245,.8);
    animation: spin 2.4s linear infinite; transform-origin: 50% 83px;
  }
  .orbit-wrap .wordmark { position: relative; font-size: 22px; letter-spacing: 2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== C. Type 极致排版 ===== */
  .wordmark-big { font-size: clamp(48px, 13vw, 76px); font-weight: 700; letter-spacing: 6px; line-height: .92; color: var(--fg); }
  .wordmark-thin { font-size: clamp(48px, 13vw, 76px); font-weight: 200; letter-spacing: 6px; line-height: .92; color: var(--fg); opacity: .92; }
  .divider { width: 46px; height: 1px; background: var(--fg); opacity: .7; margin: 20px 0 0; }

  /* ===== D. Light 亮色反色 ===== */
  .screen.light { background: #F4F4F2; color: #0A0A0A; }
  .screen.light .wordmark,
  .screen.light .wordmark-big,
  .screen.light .wordmark-thin { color: #0A0A0A; }
  .screen.light .hint { color: #9A9A9A; }
  .screen.light .divider { background: #0A0A0A; }
  .screen.light .wave span { background: #0A0A0A; }
  .screen.light .ring { border-color: rgba(10,10,10,.14); }
  .screen.light .ring.spin { border-top-color: rgba(10,10,10,.85); border-right-color: rgba(10,10,10,.3); }
  .screen.light .orbit-dot { background: #0A0A0A; box-shadow: 0 0 12px rgba(10,10,10,.4); }

  /* ===== 底部说明 ===== */
  .caption {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 12px 16px; font-size: 11.5px; line-height: 1.5; color: var(--muted);
    background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
  }
  .caption b { color: var(--fg); font-weight: 600; }
  .tag { display: inline-block; padding: 1px 7px; margin-right: 6px; border: 1px solid var(--line); border-radius: 999px; font-size: 10.5px; }
</style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-target="pulse"><b>A</b>Pulse 声波</div>
    <div class="tab" data-target="orbit"><b>B</b>Orbit 轨道</div>
    <div class="tab" data-target="type"><b>C</b>Type 排版</div>
    <div class="tab" data-target="light"><b>D</b>Light 亮色</div>
  </div>

  <div class="stage">
    <!-- A -->
    <section class="screen active" id="pulse">
      <div class="wordmark">WaveLink</div>
      <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="hint">Hi-Res Audio Player</div>
    </section>

    <!-- B -->
    <section class="screen" id="orbit">
      <div class="orbit-wrap">
        <div class="ring"></div>
        <div class="ring inner"></div>
        <div class="ring spin"></div>
        <div class="orbit-dot"></div>
        <div class="wordmark">WaveLink</div>
      </div>
    </section>

    <!-- C -->
    <section class="screen" id="type">
      <div class="wordmark-big">WAVE</div>
      <div class="wordmark-thin">LINK</div>
      <div class="divider"></div>
      <div class="hint">Hi-Res Audio Player</div>
    </section>

    <!-- D -->
    <section class="screen light" id="light">
      <div class="wordmark">WaveLink</div>
      <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="hint">Hi-Res Audio Player</div>
    </section>
  </div>

  <div class="caption" id="caption"></div>

  <script>
    const caps = {
      pulse: '<span class="tag">A · Pulse</span><b>黑底字标 + 声波脉冲</b>，呼应「wave」语义，声音在流动。落地：静态版（字标+波形截图）可用 flutter_native_splash 直接出；带脉冲动效需自定义原生启动页（Android 12 / iOS storyboard 动画）。',
      orbit: '<span class="tag">B · Orbit</span><b>黑底字标 + 旋转圆环</b>，精密设备感。落地：同 A——静态环可用 flutter_native_splash；旋转动效需自定义原生启动页。',
      type: '<span class="tag">C · Type</span><b>极致排版</b>：WAVE 粗 / LINK 细 + 细分割线，仅靠字重与留白造层次。落地：<b>纯静态</b>，flutter_native_splash 改一张 wordmark 图即可，最易落地。',
      light: '<span class="tag">D · Light</span><b>亮色反色</b>：白底 + 近黑字，与现有黑底方案对照。落地：纯静态，flutter_native_splash 改底色即可。'
    };
    const tabs = document.querySelectorAll('.tab');
    const screens = document.querySelectorAll('.screen');
    const caption = document.getElementById('caption');
    function select(target) {
      tabs.forEach(t => t.classList.toggle('active', t.dataset.target === target));
      screens.forEach(s => s.classList.toggle('active', s.id === target));
      caption.innerHTML = caps[target];
    }
    tabs.forEach(t => t.addEventListener('click', () => select(t.dataset.target)));
    select('pulse');
  </script>
</body>
</html>
