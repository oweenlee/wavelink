<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WaveLink · 交互原型</title>
<style>
  :root{
    --bg:#0E1011;    /* s1 主背景（scaffoldBackground） */
    --s1:#16191B;    /* s2 卡片/弹窗/表面 */
    --s2:#1F2427;    /* s3 高亮表面 */
    --s3:#2A3033;    /* s4 边框/分隔 */
    --t1:#F0F1F3;    /* textPrimary 94% */
    --t2:#9A9FA6;    /* textSecondary 60% */
    --t3:#5C6166;    /* textTertiary 36% */
    --line:rgba(255,255,255,.08); /* divider 8% 白（hairline） */
    --danger:#E85D5D; /* danger 红（收藏/删除/未连接） */
    --ok:#4EC9A0;     /* ok 绿（已连接状态） */
    --accent:#E8553F; /* accentFallback（播放域动态色 fallback） */
    --tab-h:60px;
    --nav-h:54px;
    --mini-h:64px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    --brand:"Space Grotesk","Space Grotesk Fallback",var(--font);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--t1);font-family:var(--font);
    font-size:15px;line-height:1.4;overscroll-behavior:none;
  }
  #app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;
    background:var(--bg);position:relative;overflow:hidden;}

  /* ── NavBar ── */
  .navbar{height:var(--nav-h);flex:0 0 auto;display:flex;align-items:center;
    padding:0 8px;background:var(--bg);border-bottom:1px solid var(--line);
    position:relative;z-index:5;}
  .nav-btn{width:40px;height:40px;display:grid;place-items:center;background:none;
    border:0;color:var(--t1);cursor:pointer;border-radius:10px;flex:0 0 auto;}
  .nav-btn:active{background:var(--s2);}
  .nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--t1);
    letter-spacing:.3px;}

  /* ── Content ── */
  .content{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;}
  .screen{display:none;padding:14px 16px 24px;}
  .screen.active{display:block;animation:fade .22s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ── Library sub-tabs + 来源筛选 ── */
  .subtabs{display:none;align-items:center;gap:14px;padding:2px 2px 10px;margin:0 0 10px;}
  .subtabs.show{display:flex;}
  .filter-btn{display:flex;align-items:center;gap:5px;border:1px solid var(--s3);
    background:var(--s1);color:var(--t2);font-size:13px;font-weight:500;
    padding:5px 10px 5px 9px;border-radius:9px;cursor:pointer;font-family:var(--font);
    line-height:1;flex:0 0 auto;margin-left:auto;}
  .filter-btn:active{background:var(--s2);}
  .filter-btn.active{border-color:var(--t1);color:var(--t1);}
  .filter-btn svg{width:13px;height:13px;}
  .filter-btn .badge{width:6px;height:6px;border-radius:50%;background:var(--ok);display:none;}
  .filter-btn.active .badge{display:block;}
  .filter-sep{flex:0 0 auto;width:1px;height:16px;background:var(--line);}
  .sub-items{display:flex;gap:22px;}
  .sub-items button{position:relative;border:0;background:none;color:var(--t3);
    font-size:15px;font-weight:500;padding:0 0 7px;cursor:pointer;font-family:var(--font);}
  .sub-items button.active{color:var(--t1);font-weight:600;}
  .sub-items button.active::after{content:"";position:absolute;left:0;right:0;bottom:0;
    height:2px;background:var(--t1);border-radius:1px;}

  /* ── list rows ── */
  .row{display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:10px;
    cursor:pointer;}
  .row:active{background:var(--s1);}
  .cover{width:52px;height:52px;border-radius:8px;flex:0 0 auto;background:var(--s2);
    display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600;
    text-shadow:0 1px 3px rgba(0,0,0,.5);overflow:hidden;}
  .cover.lg{width:128px;height:128px;border-radius:12px;font-size:14px;}
  .cover.xl{width:min(70vw,280px);height:min(70vw,280px);border-radius:14px;font-size:18px;}
  .row .meta{flex:1;min-width:0;}
  .row .t{color:var(--t1);font-weight:500;font-size:15px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .row .s{color:var(--t3);font-size:12.5px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-top:2px;}
  .row .dur{color:var(--t3);font-size:12.5px;flex:0 0 auto;}
  .heart{color:var(--t3);width:22px;height:22px;flex:0 0 auto;}
  .heart.on{color:var(--danger);}

  /* ── album grid ── */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;}
  .cell{cursor:pointer;}
  .cell .cover{width:100%;aspect-ratio:1;border-radius:8px;}
  .cell .cap{margin-top:6px;color:var(--t1);font-size:13px;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cell .sub{color:var(--t3);font-size:11.5px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-top:1px;}

  .section-title{color:var(--t2);font-size:13px;font-weight:600;letter-spacing:.4px;
    margin:18px 2px 10px;text-transform:none;}
  .empty{color:var(--t3);font-size:13px;text-align:center;padding:40px 0;}

  /* ── Now Playing ── */
  .np{display:flex;flex-direction:column;align-items:center;padding-top:10px;}
  .np .cover.xl{margin-bottom:26px;}
  .np .nt{font-size:22px;font-weight:600;color:var(--t1);text-align:center;}
  .np .na{font-size:15px;color:var(--t3);margin-top:6px;text-align:center;}
  .bar{width:100%;height:3px;background:var(--s3);border-radius:2px;margin:30px 0 8px;
    position:relative;}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;width:38%;border-radius:2px;}
  .times{width:100%;display:flex;justify-content:space-between;color:var(--t3);
    font-size:11.5px;}
  .np-ctrl{display:flex;align-items:center;justify-content:center;gap:36px;
    margin-top:28px;color:var(--t1);}
  .np-ctrl .play{width:64px;height:64px;border:1.5px solid var(--t1);border-radius:50%;
    display:grid;place-items:center;cursor:pointer;}
  .np-ctrl .sm{width:44px;height:44px;display:grid;place-items:center;cursor:pointer;
    color:var(--t2);}

  /* ── Settings ── */
  .group{background:var(--s1);border-radius:12px;overflow:hidden;margin-bottom:18px;}
  .group .gh{padding:12px 14px 6px;color:var(--t3);font-size:12px;font-weight:600;
    letter-spacing:.3px;}
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;
    border-top:1px solid var(--line);cursor:pointer;color:var(--t1);font-size:15px;}
  .set-row:first-of-type{border-top:0;}
  .set-row .v{color:var(--t3);font-size:13px;}

  /* ── Mini Player ── */
  .mini{height:var(--mini-h);flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:0 12px;background:var(--s1);border-top:1px solid var(--line);cursor:pointer;}
  .mini .cover{width:44px;height:44px;border-radius:7px;}
  .mini .meta{flex:1;min-width:0;}
  .mini .t{color:var(--t1);font-size:14px;font-weight:500;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .mini .s{color:var(--t3);font-size:12px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;}
  .mini .ctrls{display:flex;gap:14px;color:var(--t1);flex:0 0 auto;}

  /* ── TabBar ── */
  .tabbar{height:var(--tab-h);flex:0 0 auto;display:flex;background:var(--bg);
    border-top:1px solid var(--line);}
  .tabbar button{flex:1;border:0;background:none;color:var(--t3);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:10.5px;font-family:var(--font);}
  .tabbar button.active{color:var(--t1);}
  .tabbar button svg{width:22px;height:22px;}

  /* ── Drawer ── */
  .drawer{position:absolute;top:0;bottom:0;left:0;width:280px;background:var(--s1);
    transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    z-index:20;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top) + 8px);}
  .drawer.open{transform:translateX(0);}
  .drawer .dh{padding:14px 18px;font-family:var(--brand);font-size:20px;font-weight:600;
    letter-spacing:1px;color:var(--t1);}
  .drawer .dsec{padding:10px 18px 4px;color:var(--t3);font-size:11.5px;font-weight:600;
    letter-spacing:.4px;}
  .drawer .drow{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;}
  .drawer .drow:active{background:var(--s2);}
  .drawer .dico{width:34px;height:34px;border-radius:9px;background:var(--s2);
    display:grid;place-items:center;color:var(--t1);}
  .drawer .dl{color:var(--t1);font-size:14.5px;font-weight:500;}
  .drawer .ds{display:flex;align-items:center;gap:6px;color:var(--t3);font-size:11.5px;margin-top:1px;}
  .drawer .add{margin-top:auto;padding:16px 18px;color:var(--t2);font-size:14px;
    display:flex;align-items:center;gap:10px;cursor:pointer;border-top:1px solid var(--line);}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;
    transition:opacity .26s;z-index:15;}
  .scrim.show{opacity:1;visibility:visible;}

  /* ── Source Sheet（音源管理，从抽屉唤起）── */
  .sheet-scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;
    transition:opacity .24s;z-index:30;}
  .sheet-scrim.show{opacity:1;visibility:visible;}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--s1);
    border-radius:18px 18px 0 0;transform:translateY(100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:31;
    padding:8px 18px calc(env(safe-area-inset-bottom,0) + 20px);max-height:80%;overflow-y:auto;}
  .sheet.show{transform:translateY(0);}
  .sheet-handle{width:38px;height:4px;border-radius:2px;background:var(--t3);opacity:.6;
    margin:8px auto 14px;}
  .sheet-title{font-size:18px;font-weight:600;color:var(--t1);}
  .sheet-status{display:flex;align-items:center;gap:8px;color:var(--t2);font-size:13px;margin:12px 0;}
  .sheet-desc{color:var(--t2);font-size:14px;line-height:1.5;margin-bottom:8px;}
  .sheet-toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 0;
    border-top:1px solid var(--line);color:var(--t1);font-size:15px;}
  .switch{width:46px;height:28px;border-radius:14px;background:var(--s3);position:relative;
    transition:background .2s;flex:0 0 auto;}
  .switch.on{background:var(--ok);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;
    border-radius:50%;background:#fff;transition:left .2s;}
  .switch.on::after{left:21px;}
  .sheet-action{margin-top:18px;width:100%;padding:14px;border:0;border-radius:12px;
    background:var(--s2);color:var(--t1);font-size:15px;font-weight:600;cursor:pointer;
    font-family:var(--font);}
  .sheet-action:active{background:var(--s3);}

  /* ── 来源筛选 Sheet 行 ── */
  .filter-row{display:flex;align-items:center;gap:10px;padding:14px 4px;cursor:pointer;
    border-top:1px solid var(--line);}
  .filter-row:first-of-type{border-top:0;}
  .fr-name{flex:1;color:var(--t1);font-size:15px;}
  .fr-check{width:22px;height:22px;display:grid;place-items:center;font-size:15px;font-weight:700;
    color:var(--ok);}
  .filter-row:not(.sel) .fr-check{color:var(--t3);}

  .brand{font-family:var(--brand);}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .dot.green{background:var(--ok);}
  .dot.red{background:var(--danger);}
</style>
</head>
<body>
<div id="app">
  <!-- NavBar -->
  <header class="navbar">
    <button class="nav-btn" id="navBack" aria-label="返回">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="nav-title" id="navTitle">曲库</div>
    <button class="nav-btn" id="navMenu" aria-label="菜单">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </header>

  <!-- Content -->
  <main class="content" id="content">
    <!-- Library sub-tabs + 来源筛选 -->
    <div class="subtabs" id="subtabs">
      <div class="sub-items">
        <button data-sub="songs" class="active">歌曲</button>
        <button data-sub="albums">专辑</button>
        <button data-sub="artists">艺术家</button>
        <button data-sub="playlists">播放列表</button>
      </div>
      <span class="filter-sep"></span>
      <button class="filter-btn" id="sourceFilterBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        来源<span class="badge"></span>
      </button>
    </div>

    <!-- 0 曲库·歌曲 -->
    <section class="screen" data-view="lib-songs" id="scr-songs"></section>
    <!-- 1 曲库·专辑 -->
    <section class="screen" data-view="lib-albums" id="scr-albums"></section>
    <!-- 2 曲库·艺术家 -->
    <section class="screen" data-view="lib-artists" id="scr-artists"></section>
    <!-- 3 曲库·播放列表 -->
    <section class="screen" data-view="lib-playlists" id="scr-playlists"></section>

    <!-- 4 专辑详情 -->
    <section class="screen" data-view="album-detail" id="scr-album-detail"></section>
    <!-- 5 艺术家详情 -->
    <section class="screen" data-view="artist-detail" id="scr-artist-detail"></section>
    <!-- 6 播放列表详情 -->
    <section class="screen" data-view="playlist-detail" id="scr-playlist-detail"></section>

    <!-- 7 正在播放 -->
    <section class="screen" data-view="playing" id="scr-playing"></section>
    <!-- 8 设置 -->
    <section class="screen" data-view="settings" id="scr-settings"></section>
  </main>

  <!-- Mini Player -->
  <div class="mini" id="miniPlayer">
    <div class="cover" id="miniCover"></div>
    <div class="meta">
      <div class="t" id="miniTitle">夜的钢琴曲</div>
      <div class="s" id="miniArtist">群星</div>
    </div>
    <div class="ctrls">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4"/></svg>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </div>
  </div>

  <!-- TabBar -->
  <nav class="tabbar" id="tabbar">
    <button data-tab="library" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      曲库
    </button>
    <button data-tab="playing">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="10 8 16 12 10 16" fill="currentColor" stroke="none"/></svg>
      播放
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      设置
    </button>
  </nav>

  <!-- Drawer（音源管理入口） -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="dh brand">WaveLink</div>
    <div class="dsec">音源</div>
    <div class="drow" data-source="local">
      <div class="dico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
      <div><div class="dl">系统音乐库</div><div class="ds"><span class="dot green"></span>已启用 · 点击管理</div></div>
    </div>
    <div class="drow" data-source="import">
      <div class="dico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-7l-2-2H5a2 2 0 0 0-2 2z"/></svg></div>
      <div><div class="dl">文件导入</div><div class="ds"><span class="dot green"></span>已导入 45 首 · 点击管理</div></div>
    </div>
    <div class="drow" data-source="nas">
      <div class="dico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="6" rx="1.5"/><rect x="2" y="15" width="20" height="6" rx="1.5"/></svg></div>
      <div><div class="dl">NAS · 群晖</div><div class="ds"><span class="dot green"></span>已连接 · 点击管理</div></div>
    </div>
    <div class="drow" data-source="subsonic">
      <div class="dico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><line x1="7" y1="7.5" x2="7" y2="7.5"/><line x1="7" y1="16.5" x2="7" y2="16.5"/></svg></div>
      <div><div class="dl">音乐服务器</div><div class="ds"><span class="dot red"></span>未连接 · 点击设置</div></div>
    </div>
    <div class="add" data-source="add">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      添加音源
    </div>
  </aside>

  <!-- Source Sheet -->
  <div class="sheet-scrim" id="sheetScrim"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<script>
/* ===== 真实彩色封面（内容带色，打破"素"） ===== */
const COVERS = [
  'linear-gradient(135deg,#3b5b8c,#15233f)',
  'linear-gradient(135deg,#8c3b5b,#2a1320)',
  'linear-gradient(135deg,#3b8c6e,#0f2a22)',
  'linear-gradient(135deg,#8c7a3b,#2a2410)',
  'linear-gradient(135deg,#5b3b8c,#1f1330)',
  'linear-gradient(135deg,#8c5b3b,#2a1a10)',
  'linear-gradient(135deg,#3b8c8a,#0f2a2a)',
  'linear-gradient(135deg,#7a3b8c,#241030)',
  'linear-gradient(135deg,#4f6b3b,#1a2410)',
  'linear-gradient(135deg,#8c3b3b,#2a1010)',
];
const coverAt = i => COVERS[i % COVERS.length];

/* ===== 假数据 ===== */
const songs = [
  {t:'夜的钢琴曲',a:'群星',al:'夜的钢琴曲集',d:'3:42',src:'local'},

/* ===== 渲染列表 ===== */
function songRow(s,i,opts={}){
  const fav = i%4===0;
  return `<div class="row" data-album="${opts.album||''}">
    <div class="cover" style="background:${coverAt(i)}">♪</div>
    <div class="meta"><div class="t">${s.t}</div><div class="s">${s.a} · ${s.al}</div></div>
    ${opts.heart!==false?`<svg class="heart ${fav?'on':''}" viewBox="0 0 24 24" fill="${fav?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>`:''}
    ${opts.dur!==false?`<div class="dur">${s.d}</div>`:''}
  </div>`;
}
function albumCell(al,i){
  return `<div class="cell" data-album="${al.t}">
    <div class="cover" style="background:${coverAt(i+2)}">${al.t.slice(0,2)}</div>
    <div class="cap">${al.t}</div><div class="sub">${al.a}</div></div>`;
}
function artistCell(ar,i){
  return `<div class="cell" data-artist="${ar.t}">
    <div class="cover" style="background:${coverAt(i+4)};border-radius:50%">${ar.t.slice(0,1)}</div>
    <div class="cap">${ar.t}</div><div class="sub">${ar.n} 首</div></div>`;
}
function playlistRow(p,i){
  const sub = p.mine ? `播放列表 · ${p.n} 首` : `${p.src} · ${p.n} 首 · 只读`;
  return `<div class="row" data-playlist="${p.t}">
    <div class="cover" style="background:${coverAt(i+6)}">≡</div>
    <div class="meta"><div class="t">${p.t}</div><div class="s">${sub}</div></div>
    <svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>`;
}

/* ===== 填充各屏（曲库内容随来源筛选变化） ===== */
const mine = playlists.filter(p=>p.mine);
const fromSrc = playlists.filter(p=>!p.mine);

function filterNote(){ return state.sources.length < 4 ? ' · 已筛选' : ''; }
function renderLibrary(){
  const songsF = songs.filter(s=>state.sources.includes(s.src));
  document.getElementById('scr-songs').innerHTML =
    `<div class="section-title">歌曲 · ${songsF.length}${filterNote()}</div>` +
    songsF.map((s,i)=>songRow(s,i)).join('');

  const albumsF = albums.filter(a=>state.sources.includes(a.src));
  document.getElementById('scr-albums').innerHTML =
    `<div class="grid">` + albumsF.map((al,i)=>albumCell(al,i)).join('') + `</div>`;

  const artistsF = artists.filter(ar=>state.sources.includes(ar.src));
  document.getElementById('scr-artists').innerHTML =
    `<div class="grid">` + artistsF.map((ar,i)=>artistCell(ar,i)).join('') + `</div>`;

  const mineF = mine.filter(p=>state.sources.includes(p.src));
  const fromSrcF = fromSrc.filter(p=>state.sources.includes(p.src));
  document.getElementById('scr-playlists').innerHTML =
    `<div class="section-title">我的 · ${mineF.length}</div>` +
    mineF.map((p,i)=>playlistRow(p,i)).join('') +
    `<div class="section-title">来自音源 · ${fromSrcF.length}</div>` +
    fromSrcF.map((p,i)=>playlistRow(p,i)).join('');
}

/* 专辑详情 */
function renderAlbumDetail(name){
  const idx = albums.findIndex(a=>a.t===name);
  const i = idx<0?0:idx;
  const al = albums[i] || {t:name,a:'群星',n:12};
  document.getElementById('scr-album-detail').innerHTML = `
    <div style="display:flex;gap:16px;align-items:flex-end;margin-bottom:8px">
      <div class="cover lg" style="background:${coverAt(i+2)}">${al.t.slice(0,2)}</div>
      <div style="padding-bottom:6px"><div style="color:var(--t3);font-size:12px">专辑</div>
      <div class="brand" style="font-size:24px;font-weight:600;color:var(--t1);margin-top:4px">${al.t}</div>
      <div style="color:var(--t3);font-size:13px;margin-top:4px">${al.a} · ${al.n} 首</div></div>
    </div>
    <div class="section-title">曲目</div>
    ${songs.slice(0,al.n>8?8:al.n).map((s,j)=>songRow(s,j,{album:al.t})).join('')}`;
}

  const ai = artists.findIndex(a=>a.t===name);

    <div style="display:flex;flex-direction:column;align-items:center;margin:6px 0 18px">

    </div>

    <div class="grid">${albums.slice(0,6).map((al,j)=>albumCell(al,j)).join('')}</div>`;
}

    </div>
    <div class="section-title">曲目</div>

/* ===== 路由状态 ===== */
const NAV = {playing:'正在播放', settings:'设置'};
const state = { tab:'library', sub:'songs', detail:null, sources:['local','import','nas','subsonic'] };

const navTitle = document.getElementById('navTitle');
const navBack  = document.getElementById('navBack');
const subtabs  = document.getElementById('subtabs');
const content  = document.getElementById('content');

function render(){
  let view, title, canBack;
  if(state.detail){
    view = state.detail.view; title = state.detail.title; canBack = true;
  } else if(state.tab === 'library'){
    view = 'lib-' + state.sub; title = '曲库'; canBack = false;
  } else {
    view = state.tab; title = NAV[state.tab]; canBack = false;
  }
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.toggle('active', s.dataset.view === view);
  });
  navTitle.textContent = title;
  navBack.style.visibility = canBack ? 'visible' : 'hidden';
  subtabs.classList.toggle('show', state.tab === 'library' && !state.detail);
  // tabbar 高亮
  document.querySelectorAll('#tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
  content.scrollTop = 0;
}

/* TabBar 切换 */
document.querySelectorAll('#tabbar button').forEach(b=>{
  b.addEventListener('click', ()=>{
    state.tab = b.dataset.tab; state.detail = null; render();
  });
});
/* 曲库子 tab */
document.querySelectorAll('#subtabs .sub-items button').forEach(b=>{
  b.addEventListener('click', ()=>{
    state.sub = b.dataset.sub;
    document.querySelectorAll('#subtabs .sub-items button').forEach(x=>x.classList.toggle('active', x===b));
    render();
  });
});
/* 返回 */
navBack.addEventListener('click', ()=>{ state.detail = null; render(); });

/* 列表 → 详情（事件委托） */
document.getElementById('content').addEventListener('click', e=>{
  const cell = e.target.closest('[data-album],[data-artist],[data-playlist]');
  if(!cell) return;
  if(cell.dataset.album){ state.detail = {view:'album-detail', title:cell.dataset.album}; renderAlbumDetail(cell.dataset.album); render(); }
  else if(cell.dataset.artist){ state.detail = {view:'artist-detail', title:cell.dataset.artist}; renderArtistDetail(cell.dataset.artist); render(); }
  else if(cell.dataset.playlist){ state.detail = {view:'playlist-detail', title:cell.dataset.playlist}; renderPlaylistDetail(cell.dataset.playlist); render(); }
});

/* Mini Player → 播放页 */
document.getElementById('miniPlayer').addEventListener('click', ()=>{
  state.tab = 'playing'; state.detail = null; render();
});

/* 抽屉 */
const drawer = document.getElementById('drawer');
const scrim  = document.getElementById('scrim');
function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('show'); }
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('show'); }
document.getElementById('navMenu').addEventListener('click', openDrawer);
scrim.addEventListener('click', closeDrawer);

/* 音源管理 Sheet（从抽屉唤起，替代独立的"来源"模块） */
const sheet = document.getElementById('sheet');
const sheetScrim = document.getElementById('sheetScrim');
const sheetBody = document.getElementById('sheetBody');
function openSheet(html){ sheetBody.innerHTML = html; sheet.classList.add('show'); sheetScrim.classList.add('show'); }
function closeSheet(){ sheet.classList.remove('show'); sheetScrim.classList.remove('show'); }
sheetScrim.addEventListener('click', closeSheet);

const SOURCES = {
  local:    {name:'系统音乐库', ok:true,  status:'已启用',   desc:'扫描系统媒体库（Android MediaStore / iOS 音乐 App）中的音乐文件，自动并入曲库。'},
  import:   {name:'文件导入',   ok:true,  status:'已导入 45 首', desc:'从文件管理器选择本地音频文件，手动导入到曲库。'},
  nas:      {name:'NAS · 群晖', ok:true,  status:'已连接',   desc:'通过 SMB 访问局域网 NAS 上的音乐目录，当前 320 首可用。'},
  subsonic: {name:'音乐服务器', ok:false, status:'未连接',   desc:'Subsonic / Navidrome 兼容服务器，配置地址与账号后即可连接。'},
};
function sourceSheet(key){
  const s = SOURCES[key] || {name:'音源', ok:true, status:'', desc:''};
  const dot = `<span class="dot ${s.ok?'green':'red'}"></span>`;
  const action = key==='subsonic' ? '前往设置' : '管理';
  openSheet(`
    <div class="sheet-title">${s.name}</div>
    <div class="sheet-status">${dot}${s.status}</div>
    <div class="sheet-desc">${s.desc}</div>
    <div class="sheet-toggle">启用此音源 <span class="switch ${s.ok?'on':''}" onclick="this.classList.toggle('on')"></span></div>
    <button class="sheet-action" data-sheet-close>前往管理</button>
  `);
}
function addSourceSheet(){
  openSheet(`
    <div class="sheet-title">添加音源</div>
    <div class="sheet-desc">支持接入：本地文件夹 · SMB / NAS · Subsonic / Navidrome 服务器。添加后将出现在曲库与筛选中。</div>
    <button class="sheet-action" data-sheet-close>选择类型</button>
  `);
}
sheetBody.addEventListener('click', e=>{ if(e.target.closest('[data-sheet-close]')) closeSheet(); });

/* 抽屉音源项 → 唤起 Sheet */
document.querySelectorAll('.drawer [data-source]').forEach(r=>{
  r.addEventListener('click', ()=>{
    closeDrawer();
    const key = r.dataset.source;
    if(key === 'add') addSourceSheet(); else sourceSheet(key);
  });
});

/* 来源筛选（曲库子 tab 行最左侧入口） */
const sourceFilterBtn = document.getElementById('sourceFilterBtn');
const ALL_SRC = ['local','import','nas','subsonic'];
let pendingSources = [];

function updateSourceFilterBtn(){
  sourceFilterBtn.classList.toggle('active', state.sources.length < ALL_SRC.length);
}
function renderSourceFilterSheet(){
  pendingSources = [...state.sources];
  const rows = ALL_SRC.map(k=>{
    const s = SOURCES[k];
    const sel = pendingSources.includes(k);
    return `<div class="filter-row ${sel?'sel':''}" data-src-key="${k}">
      <span class="dot ${s.ok?'green':'red'}"></span>
      <span class="fr-name">${s.name}</span>
      <span class="fr-check">${sel?'✓':''}</span>
    </div>`;
  }).join('');
  openSheet(`
    <div class="sheet-title">筛选音源</div>
    <div class="sheet-desc">仅显示所选音源中的内容。取消勾选可隐藏对应音源。</div>
    ${rows}
    <div style="display:flex;gap:12px;margin-top:10px">
      <button class="sheet-action" id="filterClear" style="background:var(--s1)">清除</button>
      <button class="sheet-action" id="filterDone">完成</button>
    </div>
  `);
  sheetBody.querySelectorAll('.filter-row').forEach(r=>{
    r.addEventListener('click', ()=>{
      const k = r.dataset.srcKey;
      if(pendingSources.includes(k)) pendingSources = pendingSources.filter(x=>x!==k);
      else pendingSources.push(k);
      renderSourceFilterSheet();
    });
  });
  sheetBody.querySelector('#filterClear').addEventListener('click', ()=>{
    pendingSources = [...ALL_SRC]; renderSourceFilterSheet();
  });
  sheetBody.querySelector('#filterDone').addEventListener('click', ()=>{
    state.sources = [...pendingSources];
    closeSheet(); updateSourceFilterBtn(); renderLibrary();
  });
}
sourceFilterBtn.addEventListener('click', renderSourceFilterSheet);

/* 初始 */
renderLibrary();
updateSourceFilterBtn();
render();
</script>
